<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Apps de matemática listas para usar en el aula y servicio de creación de apps educativas a medida."
    />
    <meta name="theme-color" content="#07070b" />
    <title>Mate Apps — Apps educativas</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem('mm:theme');
        if (t !== 'light' && t !== 'dark') {
          t = 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
